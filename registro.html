<!DOCTYPE html>

<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

      <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">

      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1">Nombres y Apellidos</label>
        <input type="text" id="nombre_apellido" placeholder="Ej. Peter Valera" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
      </div>

      <div class="grid grid-cols-3 gap-2">
        <div>

          <select id="tipo_cedula" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500">

        <div>

          <select id="rol" onchange="evaluarCampoContrasena()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
            <option value="Super Administrador">Super Administrador</option>
            <option value="Personal Directivo">Personal Directivo</option>
            <option value="Personal Administrativo">Personal Administrativo</option>
            <option value="Docente / Profesor">Docente / Profesor</option>
            <option value="Estudiante / Alumno">Estudiante / Alumno</option>
            <option value="Personal Obrero">Personal Obrero</option>
            <option value="Cocina / CNAE">Cocina / CNAE</option>
          </select>
        </div>
      </div>

      <!-- CAMPO DE CONTRASEÑA DE ACCESO -->
      <div id="contenedorContrasena">
        <label class="block text-xs font-bold text-blue-400 mb-1">🔑 Contraseña de Acceso al Sistema</label>
        <input type="password" id="contrasena" placeholder="Cree una contraseña (alfanumérica, asteriscos, puntos...)" class="w-full bg-slate-950 border border-blue-900/60 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
        <p class="text-[10px] text-slate-500 mt-1">Requerido para ingresar a los módulos asignados según su rol.</p>
      </div>

      <button onclick="guardarUsuario()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl transition shadow-lg shadow-blue-600/20">
        Guardar Usuario y Generar Carnet
      </button>
    </div>

    <!-- VISTA PREVIA DEL CARNET DIGITAL -->
    <div class="flex flex-col items-center justify-center space-y-4">
      <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider">Carnet Digital Generado</h2>

      <div id="carnetVista" class="w-80 h-[420px] bg-gradient-to-b from-slate-900 to-blue-950 border border-blue-800/60 rounded-2xl p-6 flex flex-col items-center justify-between shadow-2xl relative overflow-hidden">
        
        <div class="text-center w-full z-10 border-b border-blue-800/40 pb-3">
          <h3 class="text-sm font-black text-white tracking-widest uppercase">E.B.N EL PARDILLO</h3>
          <p class="text-[9px] font-bold text-blue-400 tracking-wider">CARNET OFICIAL DE IDENTIFICACIÓN</p>
        </div>

        <div class="text-center w-full z-10 my-2">
          <h4 id="carnetNombre" class="text-base font-bold text-white">Nombre y Apellido</h4>
          <p id="carnetCedula" class="text-xs font-mono text-blue-300 font-semibold">V-00000000</p>
          <span id="carnetRol" class="inline-block mt-1 px-3 py-0.5 bg-blue-950 border border-blue-700 text-blue-300 rounded-full text-[10px] font-bold">Sin Rol</span>
        </div>

        <!-- CÓDIGO QR -->
        <div class="bg-white p-2.5 rounded-xl shadow-md z-10 flex items-center justify-center">
          <div id="qrcode"></div>
        </div>

        <div class="text-center z-10">
          <p class="text-[9px] text-slate-400 font-semibold">Acceso QR EBP</p>
        </div>
      </div>

      <!-- BOTONES DE DESCARGA -->
      <div class="flex gap-3 w-80">
        <button onclick="descargarCarnet()" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl border border-slate-700 transition">
          📄 Descargar Carnet
        </button>
        <button onclick="descargarSoloQR()" class="flex-1 py-2.5 bg-blue-900/60 hover:bg-blue-900 text-blue-200 text-xs font-bold rounded-xl border border-blue-700/60 transition">
          🔲 Descargar Solo QR
        </button>
      </div>
    </div>

  </main>

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let qrCodeObj = null;

    window.addEventListener('load', () => {

        width: 90,

      });
      evaluarCampoContrasena();
    });

      const inputClave = document.getElementById("contrasena");

        inputClave.disabled = false;
      } else {
        contenedor.style.display = "none";
        inputClave.disabled = true;
        inputClave.value = "";
      }
    }
